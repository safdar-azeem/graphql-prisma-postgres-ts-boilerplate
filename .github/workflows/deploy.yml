# =============================================================================
# GitHub Actions - Production Deployment (Blue-Green)
# =============================================================================
# Triggers on push to main branch
# Deploys to VPS using the canonical scripts/deploy.sh script
# =============================================================================

name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ===========================================================================
  # Build and Push Docker Images (Application & Matching Migrator)
  # ===========================================================================
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production application image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push matching migrator image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: migrator
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:migrator-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:migrator
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # Deploy to VPS (Invokes canonical scripts/deploy.sh)
  # ===========================================================================
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
            PROJECT_NAME=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | tr -cd '[:alnum:]-')
            APP_DIR="/opt/$PROJECT_NAME"
            REPO_URL="https://${{ secrets.GH_SECRET }}@github.com/${{ github.repository }}.git"

            mkdir -p $APP_DIR
            cd $APP_DIR

            if [ -d ".git" ]; then
              if ! git rev-parse --verify main >/dev/null 2>&1; then
                echo "📂 Incomplete git directory detected, re-initializing..."
                rm -rf .git
              fi
            fi

            if [ ! -d ".git" ]; then
              echo "📂 Cloning repository..."
              git init
              git remote add origin $REPO_URL
              git fetch origin
              git checkout -f main
              git branch --set-upstream-to=origin/main main
            else
              echo "📂 Pulling latest changes..."
              git remote set-url origin $REPO_URL
              git fetch origin
              git checkout main
              git reset --hard origin/main
            fi

            # Export matching immutable image tags for Application and Migrator
            export COMPOSE_PROJECT_NAME="$PROJECT_NAME"
            export DOCKER_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
            export DOCKER_IMAGE_MIGRATOR="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:migrator-${{ github.sha }}"

            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Run the single canonical deployment script
            chmod +x ./scripts/deploy.sh
            ./scripts/deploy.sh
