# =============================================================================
# GitHub Actions - Production Deployment (Blue-Green)
# =============================================================================
# Triggers on push to main branch
# Deploys to VPS using the canonical scripts/deploy.sh script
#
# Concurrency: only one deployment runs at a time. A second push to main
# queues behind the first — it does not cancel the in-progress deployment.
# =============================================================================

name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ===========================================================================
  # Build and Push Docker Images (Application & Matching Migrator)
  # ===========================================================================
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production application image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push matching migrator image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: migrator
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:migrator-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:migrator
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # Deploy to VPS (Invokes canonical scripts/deploy.sh)
  # ===========================================================================
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
            PROJECT_NAME=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | tr -cd '[:alnum:]-')
            APP_DIR="/opt/$PROJECT_NAME"
            DEPLOY_SHA="${{ github.sha }}"
            CLEAN_REPO_URL="https://github.com/${{ github.repository }}.git"

            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            if [ -d ".git" ]; then
              if ! git rev-parse --verify HEAD >/dev/null 2>&1; then
                echo "📂 Incomplete git directory detected, re-initializing..."
                rm -rf .git
              fi
            fi

            if [ ! -d ".git" ]; then
              echo "📂 Initializing repository..."
              git init
              git remote add origin "$CLEAN_REPO_URL"
            else
              git remote set-url origin "$CLEAN_REPO_URL"
            fi

            echo "📂 Fetching and checking out exact commit: $DEPLOY_SHA"
            AUTH_HEADER=$(echo -n "x-access-token:${{ secrets.GITHUB_TOKEN }}" | base64 | tr -d '\n')
            git -c "http.extraheader=AUTHORIZATION: basic ${AUTH_HEADER}" fetch origin "$DEPLOY_SHA"
            git checkout --detach "$DEPLOY_SHA"
            git reset --hard "$DEPLOY_SHA"

            # Export matching immutable image tags for Application and Migrator
            export COMPOSE_PROJECT_NAME="$PROJECT_NAME"
            export DOCKER_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
            export DOCKER_IMAGE_MIGRATOR="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:migrator-${{ github.sha }}"
            export COMMIT_SHA="${{ github.sha }}"

            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Run the single canonical deployment script
            chmod +x ./scripts/deploy.sh
            ./scripts/deploy.sh
