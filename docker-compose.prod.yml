# =============================================================================
# Docker Compose - Production (Blue-Green Deployment)
# =============================================================================
# Architecture:
#   - app-blue / app-green: independently addressable release groups
#   - Nginx: routes to the active group via included upstream config
#   - migrator: runs yarn db:update before any app rollout
#   - postgres / redis: shared persistent services
#
# The deploy script (scripts/deploy.sh) manages the lifecycle:
#   1. Starts shared deps (postgres, redis)
#   2. Runs migrator
#   3. Starts the candidate release group via --profile
#   4. Validates health of every candidate container
#   5. Writes active-upstream.conf in-place on host, starts/reloads Nginx
#   6. Retires the old release group
#
# Profiles:
#   blue  — includes app-blue
#   green — includes app-green
#
# Container Naming:
#   Set COMPOSE_PROJECT_NAME in .env or export before running.
#   All containers will be prefixed with this project name automatically.
# =============================================================================

services:
  # ===========================================================================
  # Nginx Load Balancer
  # ===========================================================================
  nginx:
    image: nginx:alpine
    ports:
      - '${PORT:-3001}:80'
      - '${SSL_PORT:-443}:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # Active upstream — host file written in-place by deploy.sh
      # Must exist before Nginx starts (deploy.sh ensures this)
      - ./nginx/active-upstream.conf:/etc/nginx/conf.d/active-upstream.conf:ro
    restart: always
    networks:
      - app-network
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost/nginx-health >/dev/null 2>&1 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # Production Migration Runner (Includes Prisma CLI + prisma-sharding)
  # ===========================================================================
  migrator:
    image: ${DOCKER_IMAGE_MIGRATOR:-ghcr.io/safdar-azeem/graphql-prisma-postgres-ts-boilerplate:migrator}
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    command: ["yarn", "db:update"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: "no"

  # ===========================================================================
  # Application — Blue Release Group
  # ===========================================================================
  app-blue:
    image: ${DOCKER_IMAGE:-ghcr.io/safdar-azeem/graphql-prisma-postgres-ts-boilerplate:latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    env_file:
      - .env
    environment:
      - RELEASE_GROUP=blue
      - COMMIT_SHA=${COMMIT_SHA:-unknown}
    expose:
      - '4200'
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - app-network
    profiles:
      - blue
    deploy:
      replicas: ${APP_REPLICAS:-3}
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4200/health/ready']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===========================================================================
  # Application — Green Release Group
  # ===========================================================================
  app-green:
    image: ${DOCKER_IMAGE:-ghcr.io/safdar-azeem/graphql-prisma-postgres-ts-boilerplate:latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    env_file:
      - .env
    environment:
      - RELEASE_GROUP=green
      - COMMIT_SHA=${COMMIT_SHA:-unknown}
    expose:
      - '4200'
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - app-network
    profiles:
      - green
    deploy:
      replicas: ${APP_REPLICAS:-3}
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4200/health/ready']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===========================================================================
  # Redis
  # ===========================================================================
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - app-network

  # ===========================================================================
  # PostgreSQL
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh:ro
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
