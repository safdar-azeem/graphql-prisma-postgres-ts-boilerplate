# ==============================================================================
# Nginx Load Balancer Configuration — Blue-Green Deployment
# ==============================================================================
# The active upstream is determined by /etc/nginx/conf.d/active-upstream.conf,
# which is a host bind-mount managed by scripts/deploy.sh. It includes one of:
#   nginx/upstream-blue.conf   → routes to app-blue:4200
#   nginx/upstream-green.conf  → routes to app-green:4200
#
# DNS Resolution:
#   Upstream servers are resolved dynamically using variables, which forces
#   Nginx to re-resolve through Docker's embedded DNS (127.0.0.11) on every
#   request rather than caching IPs at config load time. This ensures:
#   - Container restarts get new IPs routed correctly
#   - Multiple replicas are resolved via Docker DNS round-robin
#   - Scaling the active release updates the backend list automatically
#
# Traffic Switch:
#   deploy.sh writes the upstream file in-place (`cat upstream-${CANDIDATE}.conf > active-upstream.conf`)
#   on the host, preserving the host file inode attached to the single-file bind mount,
#   then sends `nginx -s reload`. The reload is graceful: existing connections
#   complete on old workers while new connections use the updated config.
# ==============================================================================

worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging with upstream info
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" upstream: $upstream_addr';

    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;

    # Buffers
    client_body_buffer_size 16k;
    client_max_body_size 50m;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types application/json text/plain;

    # Docker embedded DNS — required for dynamic upstream resolution.
    # Nginx resolves service names through this on every request when
    # upstream targets are specified via variables.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;

    # ===========================================================================
    # Upstream — active release group (blue or green)
    # The included file is updated in-place by scripts/deploy.sh before reload.
    # It sets the $active_upstream variable to "app-blue" or "app-green".
    # ===========================================================================
    include /etc/nginx/conf.d/active-upstream.conf;

    server {
        listen 80;
        server_name _;

        # Nginx own health — returns 200 if the Nginx worker is alive.
        # Used by the Compose healthcheck for the nginx service itself.
        location = /nginx-health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Application readiness — proxied to the active release group.
        # Used by deploy.sh for public post-switch validation.
        location /health/ready {
            set $backend "http://${active_upstream}:4200";
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
        }

        # Application health (liveness + legacy)
        location /health {
            set $backend "http://${active_upstream}:4200";
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
        }

        # GraphQL endpoint
        location /graphql {
            set $backend "http://${active_upstream}:4200";
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering on;
        }

        # All other paths
        location / {
            set $backend "http://${active_upstream}:4200";
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
