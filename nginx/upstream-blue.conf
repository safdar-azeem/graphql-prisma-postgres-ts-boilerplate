# Blue-green upstream template — blue release group
# Copied to nginx/active-upstream.conf by scripts/deploy.sh
# Defines a map that sets $active_upstream for every request.
# Dynamic DNS: Nginx resolves "app-blue" through Docker DNS on every request
# because proxy_pass uses a variable, not a static upstream name.
map $uri $active_upstream {
    default "app-blue";
}
