type Query
type Mutation
scalar Any

scalar JSON
scalar Upload
scalar ObjectId
scalar DateTime

type PaginationInfo {
  currentPage: Int!
  totalPages: Int!
  totalItems: Int!
}

input PaginationInput {
  page: Int = 1
  limit: Int = 10
}

input DateRangeInput {
  from: DateTime
  to: DateTime
}

enum SortDirection {
  ASC
  DESC
}

input SortInput {
  field: String!
  direction: SortDirection = DESC
}

input AttachmentInput {
  fileName: String!
  fileUrl: String!
  fileType: String!
  fileSize: Float
}

type AttachmentFile {
  fileName: String
  fileUrl: String
  fileType: String
  fileSize: Float
}

# Must stay in sync with src/authorization/permissions.ts keys
enum Permissions {
  USERS_READ
  USERS_CREATE
  USERS_UPDATE
  USERS_DELETE
  USERS_MANAGE_STATUS
  USERS_MANAGE_ROLES
  USERS_MANAGE_PERMISSIONS
  ROLES_READ
  ROLES_CREATE
  ROLES_UPDATE
  ROLES_DELETE
  WORKSPACE_READ
  WORKSPACE_UPDATE
  WORKSPACE_TRANSFER_OWNERSHIP
  AUDIT_READ
}

enum UserType {
  OWNER
  MEMBER
}

enum UserStatus {
  ACTIVE
  SUSPENDED
  INVITED
}

enum WorkspaceStatus {
  ACTIVE
  SUSPENDED
  ARCHIVED
}
