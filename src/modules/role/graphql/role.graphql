type Role {
  id: ID!
  name: String!
  description: String
  workspaceId: String!
  permissions: [Permissions!]!
  isSystem: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type RoleConnection {
  items: [Role!]!
  pageInfo: PaginationInfo!
}

enum RoleSortField {
  name
  createdAt
  updatedAt
}

input RoleSortInput {
  field: RoleSortField = createdAt
  direction: SortDirection = DESC
}

input RoleFilterInput {
  dateRange: DateRangeInput
  isSystem: Boolean
}

input CreateRoleInput {
  name: String!
  description: String
  permissions: [Permissions!]!
}

input UpdateRoleInput {
  name: String
  description: String
  permissions: [Permissions!]
}

extend type Query {
  getRoles(
    pagination: PaginationInput
    search: String
    filter: RoleFilterInput
    sort: RoleSortInput
  ): RoleConnection!
  getRole(id: ID!): Role!
}

extend type Mutation {
  createRole(data: CreateRoleInput!): Role!
  updateRole(id: ID!, data: UpdateRoleInput!): Role!
  deleteRole(id: ID!): Boolean!
}
