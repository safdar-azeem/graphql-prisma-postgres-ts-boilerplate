type ManagedUser {
  id: ID!
  email: String!
  username: String!
  avatar: String
  userType: UserType!
  status: UserStatus!
  workspaceId: String!
  roles: [Role!]!
  customPermissions: [Permissions!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ManagedUserConnection {
  items: [ManagedUser!]!
  pageInfo: PaginationInfo!
}

enum UserSortField {
  username
  email
  createdAt
  updatedAt
}

input UserSortInput {
  field: UserSortField = createdAt
  direction: SortDirection = DESC
}

input CreateUserInput {
  email: String!
  username: String!
  password: String!
  roleIds: [ID!]
  customPermissions: [Permissions!]
}

input UpdateUserInput {
  username: String
  avatar: String
}

input UpdateUserStatusInput {
  status: UserStatus!
}

input SetUserRolesInput {
  roleIds: [ID!]!
}

input SetUserPermissionsInput {
  customPermissions: [Permissions!]!
}

input UsersFilterInput {
  status: UserStatus
  dateRange: DateRangeInput
}

extend type Query {
  getUsers(
    pagination: PaginationInput
    search: String
    filter: UsersFilterInput
    sort: UserSortInput
  ): ManagedUserConnection!
  getUser(id: ID!): ManagedUser!
}

extend type Mutation {
  createUser(data: CreateUserInput!): ManagedUser!
  updateUser(id: ID!, data: UpdateUserInput!): ManagedUser!
  updateUserStatus(id: ID!, data: UpdateUserStatusInput!): ManagedUser!
  setUserRoles(userId: ID!, data: SetUserRolesInput!): ManagedUser!
  setUserPermissions(userId: ID!, data: SetUserPermissionsInput!): ManagedUser!
  deleteUser(id: ID!): Boolean!
  assignRolesToUser(userId: ID!, roleIds: [ID!]!): ManagedUser!
  removeRolesFromUser(userId: ID!, roleIds: [ID!]!): ManagedUser!
}
